name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Синтаксис snihunt.py
        run: python -m py_compile skills/snishka/scripts/snihunt.py
      - name: Тесты
        run: python -m unittest discover -s tests -v
